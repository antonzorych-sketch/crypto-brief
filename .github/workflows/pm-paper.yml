name: pm-paper
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      minutes: {description: 'Сколько минут работать', default: '320'}
      coins: {description: 'Монеты', default: 'btc,eth,sol,xrp'}
      edge: {description: 'Мин. перевес', default: '0.04'}
  push:
    paths: ['pm/lag.py', 'pm/report.py', '.github/workflows/pm-paper.yml']
permissions:
  contents: write
concurrency:
  group: pm-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q websockets cryptography
      - name: Restore earlier results
        run: |
          git fetch -q origin pm-results && git checkout FETCH_HEAD -- pm/paper && git reset -q || echo "first run"
      - name: Telegram chat (кэш, не публичный)
        if: always()
        uses: actions/cache@v4
        with:
          path: .tg
          key: tg-chat-${{ github.run_id }}
          restore-keys: tg-chat-
      - name: Paper trading
        env:
          PM_KEY_ID: ${{ secrets.PM_KEY_ID || vars.PM_KEY_ID }}
          PM_SECRET: ${{ secrets.PM_SECRET || vars.PM_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail; mkdir -p pm/paper
          M="${{ github.event.inputs.minutes }}"
          if [ -z "$M" ]; then if [ "${{ github.event_name }}" = "push" ]; then M=12; else M=320; fi; fi
          export RUN_ID=$(date -u +%Y%m%d-%H%M)
          # арбитраж и пары отключены (прогон 23.10: арбитража нет, пары −$223); LIP только на сериях с плюсом
          python -u pm/weather.py --minutes "$M" --only KXHIGHPHIL,KXHIGHDEN > pm/paper/last-wx-log.txt 2>&1 & P2=$!
          python -u pm/lip.py --minutes "$M" --series KXTEMP,KXHIGH,KXLOW,KXBRENT,KXNATGAS --top 30 > pm/paper/last-lip-log.txt 2>&1 & P4=$!
          python -u pm/spx.py --minutes "$M" > pm/paper/last-spx-log.txt 2>&1 & P5=$!
          # промежуточная сводка в Telegram каждые 45 минут, пока идёт прогон
          # каждые 45 минут: отчёт, сохранение в pm-results (дашборд обновляется) и промежуточная сводка в Telegram
          ( while sleep 2700; do python pm/ksettle.py > /dev/null 2>&1; python pm/report.py > /dev/null 2>&1; bash pm/save.sh interim > /dev/null 2>&1; python pm/notify.py --interim > /dev/null 2>&1; done ) & PN=$!
          python -u pm/lag.py --minutes "$M" --coins "${{ github.event.inputs.coins || 'btc,eth,sol,xrp' }}" --edge "${{ github.event.inputs.edge || '9' }}" --edge-last 9 --edge-model 9 --shrink 0.85 --shrink-last 0.9 2>&1 | tee pm/paper/last-log.txt
          wait $P2 $P4 $P5
          kill $PN 2>/dev/null || true
      - name: Report and save
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python pm/ksettle.py || true
          python pm/report.py || true
          python pm/notify.py || true
          bash pm/save.sh final
