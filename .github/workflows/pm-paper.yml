name: pm-paper
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      minutes: {description: 'Сколько минут работать', default: '320'}
      coins: {description: 'Монеты', default: 'btc,eth,sol,xrp'}
      edge: {description: 'Мин. перевес', default: '0.04'}
  push:
    paths: ['pm/lag.py', 'pm/report.py', '.github/workflows/pm-paper.yml']
permissions:
  contents: write
concurrency:
  group: pm-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q websockets cryptography
      - name: Restore earlier results
        run: |
          git fetch -q origin pm-results && git checkout FETCH_HEAD -- pm/paper && git reset -q || echo "first run"
      - name: Paper trading
        env:
          PM_KEY_ID: ${{ secrets.PM_KEY_ID || vars.PM_KEY_ID }}
          PM_SECRET: ${{ secrets.PM_SECRET || vars.PM_SECRET }}
        run: |
          set -o pipefail; mkdir -p pm/paper
          M="${{ github.event.inputs.minutes }}"
          if [ -z "$M" ]; then if [ "${{ github.event_name }}" = "push" ]; then M=12; else M=320; fi; fi
          export RUN_ID=$(date -u +%Y%m%d-%H%M)
          python -u pm/arb.py --minutes "$M" > pm/paper/last-arb-log.txt 2>&1 &
          python -u pm/lag.py --minutes "$M" --coins "${{ github.event.inputs.coins || 'btc,eth,sol,xrp' }}" --edge "${{ github.event.inputs.edge || '0.04' }}" 2>&1 | tee pm/paper/last-log.txt
          wait
      - name: Report and save
        if: always()
        run: |
          python pm/report.py || true
          git config --global user.name github-actions; git config --global user.email actions@github.com
          # результаты живут в отдельной ветке pm-results только с данными (без кода и workflow)
          for i in 1 2 3; do
            rm -rf /tmp/res
            if git fetch -q origin pm-results; then git worktree add -q --detach /tmp/res FETCH_HEAD
            else git worktree add -q --detach /tmp/res && (cd /tmp/res && git checkout -q --orphan r && git rm -rqf .); fi
            mkdir -p /tmp/res/pm && cp -r pm/paper /tmp/res/pm/
            (cd /tmp/res && git add -A pm/paper && (git commit -q -m "pm-results $(date -u +%F-%H%M) [skip ci]" || true) && git push origin HEAD:pm-results) && break
            echo "push не прошёл, попытка $i"; git worktree remove --force /tmp/res; sleep 10
          done
