name: v3
on:
  workflow_dispatch:
  push:
    paths: ['backtest/v3.py', '.github/workflows/v3.yml']
permissions:
  contents: write
concurrency: v3
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy requests scikit-learn
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: binance-archive-${{ github.run_id }}
          restore-keys: binance-archive-
      - name: V3
        run: |
          set -o pipefail
          mkdir -p data_cache
          python -u backtest/v3.py --start 2023-01-01 --out backtest/v3.json 2>&1 | grep -v "Warning\|See https" | tee backtest/v3-log.txt
      - name: Save results
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -B v3
          git add -f backtest/v3-log.txt backtest/v3.json 2>/dev/null || git add -f backtest/v3-log.txt
          git commit -q -m "V3 results [skip ci]" || true
          git push -f origin v3
      - name: Import into app
        if: success()
        run: curl -s -X POST https://lnmdljepzszvjbxigwsr.supabase.co/functions/v1/import-v3
