name: trend
on:
  workflow_dispatch:
  push:
    paths: ['backtest/trend.py', '.github/workflows/trend.yml']
permissions:
  contents: write
concurrency: trend
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy requests scikit-learn
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: binance-archive-${{ github.run_id }}
          restore-keys: binance-archive-
      - name: Trend
        run: |
          set -o pipefail
          mkdir -p data_cache
          python -u backtest/trend.py --start 2023-01-01 --out backtest/trend.json 2>&1 | grep -v "Warning\|See https" | tee backtest/trend-log.txt
      - name: Save results
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -B trend
          git add -f backtest/trend-log.txt backtest/trend.json 2>/dev/null || git add -f backtest/trend-log.txt
          git commit -q -m "Trend results [skip ci]" || true
          git push -f origin trend
      - name: Import into app
        if: success()
        run: curl -s -X POST https://lnmdljepzszvjbxigwsr.supabase.co/functions/v1/import-trend
