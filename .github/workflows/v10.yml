name: v10
on:
  workflow_dispatch:
  push:
    paths: ['backtest/v10.py', '.github/workflows/v10.yml']
permissions:
  contents: write
concurrency: v10
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: binance-archive-${{ github.run_id }}
          restore-keys: binance-archive-
      - name: V3
        run: |
          set -o pipefail
          mkdir -p data_cache
          python -u backtest/v10.py 2>&1 | grep -v "Warning\|See https" | tee backtest/v10-log.txt
      - name: Save results
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -B v10
          git add -f backtest/v10-log.txt backtest/v10.json 2>/dev/null || git add -f backtest/v10-log.txt
          git commit -q -m "V10 results [skip ci]" || true
          git push -f origin v10
